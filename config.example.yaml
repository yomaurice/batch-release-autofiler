# Copy this file to config.yaml and edit it. config.yaml is not committed to git.

portal_url: https://qpbatchrelease.health.gov.il/batch-release

# Root holding one sub-folder per user, each containing '<PRODUCT> <batch> <dd.mm.yyyy> <delivery>' folders.
# Work PC:  S:\Batch ready for release\AA Pending QP Release\AA RELEASED & BEFORE MOH PORTAL
# Testing:  test_data/s_drive  (built by: python tools/make_test_tree.py <export.xlsx>)
attachments_root: test_data/s_drive
folder_search_depth: 3          # folder levels searched below each user's folder

# People who file requests. Only rows whose "Usage dec. made by" is the selected person are filed.
#   folder       = their sub-folder under attachments_root
#   portal_name  = their name exactly as in the portal greeting "שלום, <name>" (top-left after login).
#                  The app checks it after login, so nobody can file under someone else's account.
# Portal username + password are NOT stored here: enter them once in the app ("Login details"),
# and they are kept encrypted in Windows Credential Manager.
users:
  DSABAG01:
    display_name: Dudi
    folder: Dudi
    portal_name: דוד
  EBISMUTH:
    display_name: Esther
    folder: Esther
    portal_name: אסתר      # TODO: confirm against the portal greeting
  GSHETRIT:
    display_name: Gil
    folder: Gil
    portal_name: גיל       # TODO: confirm against the portal greeting

# Date format typed into the portal's date fields
portal_date_format: "%d/%m/%Y"

# Run modes:  dry-run = fill only, never send   confirm = ask before each send   auto = send all automatically
# modes        = the modes offered in the app (e.g. just [auto] once things are stable)
# default_mode = the one selected when the app opens
modes: [dry-run, confirm, auto]
default_mode: dry-run

# chrome = your installed Google Chrome, msedge = Microsoft Edge
browser_channel: chrome
results_dir: results

# SAP column names (change only if the export layout changes)
columns:
  batch: Batch
  mfg_date: MFG Date
  expiry_date: Expiry Date
  license: GI External License number
  lot_created: Lot created on
  decided_by: Usage dec. made by
  product: Short text for inspection object
  ud_code: UD code              # rows with an empty UD code are skipped

# Override how form elements are found, after running `python run.py inspect`.
# Prefix label: / text: / role:, or give a CSS selector, e.g.  batch_number: "input[formcontrolname=batchNumber]"
selectors: {}
