# Copy this file to config.yaml and edit it. config.yaml is not committed to git.

portal_url: https://qpbatchrelease.health.gov.il/batch-release

# Root holding one sub-folder per user, each containing '<PRODUCT> <batch> <dd.mm.yyyy> <delivery>' folders.
# Work PC:  S:\Batch ready for release\AA Pending QP Release\AA RELEASED & BEFORE MOH PORTAL
# Testing:  test_data/s_drive  (built by: python tools/make_test_tree.py <export.xlsx>)
attachments_root: test_data/s_drive
folder_search_depth: 3          # folder levels searched below each user's folder

# Rows are filed only when "Usage dec. made by" is one of these SAP users.
# Value = that user's sub-folder under attachments_root (leave empty to search the whole root).
users:
  DSABAG01: Dudi
  EBISMUTH: Esther
  GSHETRIT: Gil

# Date format typed into the portal's date fields
portal_date_format: "%d/%m/%Y"

# chrome = your installed Google Chrome, msedge = Microsoft Edge
browser_channel: chrome
results_dir: results

# SAP column names (change only if the export layout changes)
columns:
  batch: Batch
  mfg_date: MFG Date
  expiry_date: Expiry Date
  license: GI External License number
  lot_created: Lot created on
  decided_by: Usage dec. made by
  product: Short text for inspection object

# Override how form elements are found, after running `python run.py inspect`.
# Prefix label: / text: / role:, or give a CSS selector, e.g.  batch_number: "input[formcontrolname=batchNumber]"
selectors: {}
